name: TASI Stock Filter CI/CD

# تشغيل الأتمتة عند تحديث فرع main أو master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. إعداد بيئة عمل بايثون (تثبيت إصدار مستقر 3.10)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # تفعيل التخزين المؤقت لتسريع عملية التثبيت في المرات القادمة

    # 3. تحديث أداة pip وتثبيت مكتبات المشروع الأساسية
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. فحص جودة الكود وبنيته (Code Syntax Linting)
    - name: Lint and Compile Check
      run: |
        python -m py_compile app.py

    # 5. رسالة نجاح في حال اجتياز الفحص بنجاح
    - name: Workflow Status
      run: echo "🎉 تم فحص الكود بنجاح وهو جاهز للنشر التلقائي على Streamlit Cloud!"
