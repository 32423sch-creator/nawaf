name: TASI Stock Filter CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. إعداد بيئة عمل بايثون 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # تمت إزالة خاصية الكاش المؤقت هنا لتفادي الخطأ إذا كان ملف المتطلبات مفقوداً

    # 3. تحديث أداة pip وتثبيت المكتبات (فقط إذا كان الملف موجوداً)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt
        else 
          echo "⚠️ تنبيه: ملف requirements.txt غير موجود بعد، سيتم تثبيت المكتبات الأساسية للفحص."
          pip install streamlit yfinance pandas pandas-ta
        fi

    # 4. فحص جودة الكود وبنيته البرمجية
    - name: Lint and Compile Check
      run: |
        python -m py_compile app.py

    # 5. رسالة نجاح الفحص
    - name: Workflow Status
      run: echo "🎉 تم فحص الكود واجتياز اختبارات البناء بنجاح!"
