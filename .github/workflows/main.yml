# 📊 فلتر السوق السعودي (TASI) الذكي بالذكاء الاصطناعي

تطبيق ويب تفاعلي ومجاني مصمم لفلترة وتصفية الأسهم في **السوق المالية السعودية (تاسي)** بناءً على السعر والمؤشرات الفنية مثل مؤشر القوة النسبية (RSI)، بهدف مساعدة المتداولين على اقتناص الفرص الاستثمارية بسهولة.

---

## ✨ المميزات الرئيسية
* **سحب بيانات حي ومجاني:** يتصل البرنامج مباشرة ببيانات السوق عبر `yfinance`.
* **فلترة فنية ذكية:** تصفية الأسهم بناءً على السعر الحقيقي وحالة تشبع البيع أو الشراء (RSI).
* **واجهة مستخدم تفاعلية:** لوحة تحكم جانبية مرنة وسهلة الاستخدام عبر الجوال أو الكمبيوتر.
* **أتمتة كاملة (CI/CD):** مدمج مع GitHub Actions لتحديث التطبيق تلقائياً عند أي تعديل.

---

## 🚀 طريقة التشغيل المحلي (Local Setup)

إذا كنت ترغب في تشغيل البرنامج على جهازك الشخصي، اتبع الخطوات التالية:

### 1. استنساخ المستودع
```bash
git clone https://github.com
cd YOUR_REPO_NAME
```

### 2. تثبيت المكتبات المطلوبة
تأكد من تثبيت Python 3.10 أو أحدث، ثم نفذ الأمر التالي:
```bash
pip install -r requirements.txt
```

### 3. تشغيل تطبيق الويب
```bash
streamlit run app.py
```

---

## 🛠️ بنية الملفات (Project Structure)
```text
├── .github/
│   └── workflows/
│       └── main.yml        # ملف الأتمتة والفحص التلقائي لـ GitHub Actions
├── app.py                  # الكود البرمجي الرئيسي للتطبيق (Streamlit)
├── requirements.txt        # المكتبات البرمجية المطلوبة للتشغيل
└── README.md               # ملف التوثيق الحالي
```

---

## 📈 التقنيات المستخدمة
* **Python 3.10** - لغة البرمجة الأساسية.
* **Streamlit** - لبناء واجهة مستخدم الويب التفاعلية.
* **YFinance** - لجلب أسعار الأسهم اللحظية للسوق السعودي.
* **Pandas TA** - لحساب المؤشرات الفنية والتحليل الذكي.

---

## ⚠️ إخلاء مسؤولية
جميع البيانات والنصائح المستخرجة من هذا البرنامج هي لأغراض تعليمية وإرشادية فقط، ولا تعتبر توصية مباشرة للبيع أو الشراء. قرار الاستثمار يقع كاملاً على عاتق المستخدم.
